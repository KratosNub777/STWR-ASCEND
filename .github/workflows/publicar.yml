# Publica la web (GitHub Pages) y compila el APK de Android cada vez que entra un cambio a main.
# Solo main publica: así un cambio todavía no fusionado nunca llega a los celulares.
name: Publicar web y APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: ver
        run: echo "version=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
      - name: Publicar en GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          commit_message: "Publicar web ${{ steps.ver.outputs.version }}"

  android:
    name: APK de Android
    runs-on: ubuntu-latest
    needs: web
    env:
      VERSION_CODE: ${{ needs.web.outputs.version }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      # el kit de Android ya viene instalado en los servidores de GitHub (ANDROID_HOME)
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.web.outputs.version }}
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/STWR-ASCEND.apk"
      - name: Guardar el APK en esta ejecución
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: STWR-ASCEND-apk
          path: STWR-ASCEND.apk

      # Solo se publica para descargar si está firmado con la clave fija (secreto ANDROID_KEYSTORE_PASSWORD).
      - name: Publicar el APK en Releases
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.${{ needs.web.outputs.version }}
          name: STWR-ASCEND 1.${{ needs.web.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: STWR-ASCEND.apk
          body: |
            Descargá **STWR-ASCEND.apk** desde tu celular Android e instalalo.
            Si ya tenías la app, se instala encima y no perdés tus datos.
      - name: Avisar a las apps instaladas que hay versión nueva
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          mkdir -p version
          printf '{"version": %s, "apk": "https://github.com/%s/releases/latest/download/STWR-ASCEND.apk"}\n' "$VERSION_CODE" "$GITHUB_REPOSITORY" > version/version.json
      - if: env.ANDROID_KEYSTORE_PASSWORD != ''
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./version
          keep_files: true
          commit_message: "Versión del APK ${{ needs.web.outputs.version }}"
      - name: Falta la clave de firma
        if: env.ANDROID_KEYSTORE_PASSWORD == ''
        run: echo "::warning::El APK se compiló con una firma de prueba y NO se publicó en Releases. Cargá el secreto ANDROID_KEYSTORE_PASSWORD (ver docs/ANDROID.md)."
